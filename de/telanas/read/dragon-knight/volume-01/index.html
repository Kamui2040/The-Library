<!doctype html>
<html lang="de" data-route-locale="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Lies Band 1 von Der Drachenritter im Telanas-Reader der Library.">
  <title>The Library — Der Drachenritter — Band 1</title>
  <link rel="alternate" hreflang="en" href="../../../../../en/telanas/read/dragon-knight/volume-01/">
  <link rel="alternate" hreflang="de" href="../../../../../de/telanas/read/dragon-knight/volume-01/">
  <link rel="stylesheet" href="../../../../../assets/telanas/styles.css">
  <link rel="stylesheet" href="../../../../../assets/reader/reader-content.css">
  <link rel="stylesheet" href="../../../../../assets/reader/reader-presentation.css">
  <link rel="stylesheet" href="../../../../../assets/reader/reader-page-turn.css">
  <link rel="stylesheet" href="../../../../../assets/reader/reader-progress.css">
  <link rel="stylesheet" href="../../../../../assets/reader/reader-bookmarks.css">
  <script defer src="../../../../../assets/spoiler-profile.js"></script>
  <script defer src="../../../../../assets/library-shell.js"></script>
  <script defer src="../../../../../assets/reader/reader-engine.js"></script>
  <script defer src="../../../../../assets/reader/reader-presentation.js"></script>
  <script defer src="../../../../../assets/reader/reader-page-turn.js"></script>
  <script defer src="../../../../../assets/reader/reader-progress.js"></script>
  <script defer src="../../../../../assets/reader/reader.js"></script>
  <script defer src="../../../../../assets/reader/reader-bookmarks.js"></script>
</head>
<body
  class="reader-page"
  data-reader-theme="dark"
  data-reader-typeface="serif"
  data-reader-book-manifest="../../../../../content/worlds/telanas/books/dragon-knight/volume-01/book.json"
>
  <header class="reader-header">
    <div class="reader-header-inner">
      <a class="reader-home" href="../../../">← <span data-reader-back>Telanas</span></a>
      <div class="reader-title" aria-live="polite" data-reader-title>Reader wird geladen…</div>
      <div class="reader-tools" aria-label="Reader-Steuerung">
        <button class="reader-tool" type="button" data-layout-button="spread" aria-pressed="true">Buchansicht</button>
        <button class="reader-tool" type="button" data-layout-button="single" aria-pressed="false">Einzelseite</button>
        <button class="reader-tool" type="button" data-layout-button="continuous" aria-pressed="false">Fortlaufend</button>
        <button
          class="reader-tool reader-bookmark-toggle"
          type="button"
          data-reader-bookmark-toggle
          aria-pressed="false"
          aria-label="Aktuelle Stelle als Lesezeichen speichern"
          title="Aktuelle Stelle als Lesezeichen speichern"
          disabled
        ><span aria-hidden="true" data-reader-bookmark-icon>☆</span></button>

        <details class="reader-settings" data-reader-settings>
          <summary class="reader-tool reader-settings-toggle" data-reader-settings-toggle aria-label="Reader-Einstellungen" title="Reader-Einstellungen">Aa</summary>
          <div class="reader-settings-panel">
            <label class="reader-setting">
              <span data-reader-setting-label="theme">Darstellung</span>
              <select data-reader-theme>
                <option value="dark">Dunkel</option>
                <option value="light">Hell</option>
                <option value="parchment">Pergament</option>
              </select>
            </label>
            <label class="reader-setting">
              <span data-reader-setting-label="typeface">Schriftart</span>
              <select data-reader-typeface>
                <option value="serif">Buch-Serifenschrift</option>
                <option value="sans">Sans-Serif</option>
              </select>
            </label>
            <label class="reader-setting">
              <span data-reader-setting-label="fontSize">Textgröße</span>
              <select data-reader-font-size>
                <option value="0.9">Klein</option>
                <option value="1" selected>Standard</option>
                <option value="1.1">Groß</option>
                <option value="1.2">Sehr groß</option>
              </select>
            </label>
            <label class="reader-setting">
              <span data-reader-setting-label="lineHeight">Zeilenabstand</span>
              <select data-reader-line-height>
                <option value="1.5">Kompakt</option>
                <option value="1.75" selected>Bequem</option>
                <option value="2">Locker</option>
              </select>
            </label>
            <label class="reader-setting">
              <span data-reader-progress-setting-label>Spoiler-Fortschritt</span>
              <select data-reader-progress-mode>
                <option value="ask" selected>Am Bandende nachfragen</option>
                <option value="automatic">Automatisch aktualisieren</option>
                <option value="manual">Manuell im Lexikon</option>
              </select>
            </label>
          </div>
        </details>

        <label class="select-control reader-language">
          <span class="visually-hidden">Sprache</span>
          <select data-language-select aria-label="Sprache">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="reader-shell" data-reader-shell>
    <div class="toc-dock" data-toc-dock>
      <button class="toc-toggle" type="button" aria-expanded="false" aria-controls="reader-toc" aria-label="Inhaltsverzeichnis" data-toc-toggle>☰</button>
      <aside class="toc-panel" id="reader-toc" aria-label="Inhaltsverzeichnis" data-toc-panel>
        <p class="toc-heading" data-toc-heading>Inhalt</p>
        <nav class="toc-list" data-reader-toc-list></nav>
        <section class="reader-bookmarks-panel" aria-labelledby="reader-bookmarks-heading">
          <div class="reader-bookmarks-heading-row">
            <p class="reader-bookmarks-heading" id="reader-bookmarks-heading" data-reader-bookmarks-heading>Lesezeichen</p>
            <span class="reader-bookmark-count" data-reader-bookmark-count aria-label="Gespeicherte Lesezeichen">0</span>
          </div>
          <p class="reader-bookmarks-empty" data-reader-bookmarks-empty>Noch keine gespeicherten Stellen.</p>
          <div class="reader-bookmark-list" data-reader-bookmarks-list hidden></div>
        </section>
      </aside>
    </div>

    <section class="book-stage" aria-live="polite">
      <div class="book-spread" data-book-spread>
        <article class="book-page" data-book-page="left"></article>
        <article class="book-page" data-book-page="right"></article>
      </div>

      <article class="book-page pagination-probe" data-pagination-probe aria-hidden="true"></article>

      <div class="reader-status">
        <div class="reader-pager">
          <button class="reader-page-nav" type="button" data-page-previous aria-label="Vorherige Seite">←</button>
          <span data-reader-position>Wird geladen…</span>
          <button class="reader-page-nav" type="button" data-page-next aria-label="Nächste Seite">→</button>
        </div>
        <span data-reader-mode>Buchansicht</span>
      </div>

      <section class="reader-completion" hidden data-reader-completion aria-live="polite" aria-labelledby="reader-completion-title">
        <div class="reader-completion-copy">
          <p class="eyebrow" data-reader-completion-eyebrow>Lesefortschritt</p>
          <h2 id="reader-completion-title" data-reader-completion-title>Diesen Band als abgeschlossen markieren?</h2>
          <p class="reader-completion-text" data-reader-completion-text></p>
        </div>
        <div class="reader-completion-actions">
          <button class="reader-tool reader-completion-primary" type="button" data-reader-mark-complete>Als abgeschlossen markieren</button>
          <button class="reader-tool" type="button" data-reader-dismiss-completion>Nicht jetzt</button>
          <a class="reader-completion-link" href="../../../../../prototype/telanas/lexicon.html" data-reader-completion-lexicon data-prototype-bridge>Lexikon öffnen</a>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
