<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Prototype Telanas reader inside The Library.">
  <title>The Library — Telanas Reader</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reader-content.css">
  <link rel="stylesheet" href="reader-presentation.css">
  <link rel="stylesheet" href="reader-physical.css">
  <script defer src="site.js"></script>
  <script defer src="reader-engine.js"></script>
  <script defer src="reader-presentation.js"></script>
  <script defer src="reader-physical.js"></script>
  <script defer src="reader.js"></script>
</head>
<body class="reader-page" data-reader-theme="dark" data-reader-typeface="serif">
  <header class="reader-header">
    <div class="reader-header-inner">
      <a class="reader-home" href="index.html">← <span data-reader-back>Telanas</span></a>
      <div class="reader-title" aria-live="polite" data-reader-title>Loading reader…</div>
      <div class="reader-tools" aria-label="Reader controls">
        <button class="reader-tool" type="button" data-layout-button="spread" aria-pressed="true">Spread</button>
        <button class="reader-tool" type="button" data-layout-button="single" aria-pressed="false">Single</button>
        <button class="reader-tool" type="button" data-layout-button="continuous" aria-pressed="false">Continuous</button>

        <details class="reader-settings" data-reader-settings>
          <summary class="reader-tool reader-settings-toggle" data-reader-settings-toggle aria-label="Reader settings" title="Reader settings">Aa</summary>
          <div class="reader-settings-panel">
            <label class="reader-setting">
              <span data-reader-setting-label="theme">Theme</span>
              <select data-reader-theme>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="parchment">Parchment</option>
              </select>
            </label>
            <label class="reader-setting">
              <span data-reader-setting-label="typeface">Typeface</span>
              <select data-reader-typeface>
                <option value="serif">Book serif</option>
                <option value="sans">Sans serif</option>
              </select>
            </label>
            <label class="reader-setting">
              <span data-reader-setting-label="fontSize">Text size</span>
              <select data-reader-font-size>
                <option value="0.9">Small</option>
                <option value="1" selected>Standard</option>
                <option value="1.1">Large</option>
                <option value="1.2">Extra large</option>
              </select>
            </label>
            <label class="reader-setting">
              <span data-reader-setting-label="lineHeight">Line spacing</span>
              <select data-reader-line-height>
                <option value="1.5">Compact</option>
                <option value="1.75" selected>Comfortable</option>
                <option value="2">Relaxed</option>
              </select>
            </label>
            <label class="reader-setting">
              <span data-reader-setting-label="transition">Page transition</span>
              <select data-reader-transition>
                <option value="page-turn">Page turn</option>
                <option value="fade">Fade</option>
                <option value="none">None</option>
              </select>
            </label>
          </div>
        </details>

        <label class="select-control reader-language">
          <span class="visually-hidden" data-i18n="nav.language">Language</span>
          <select data-language-select aria-label="Language">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="reader-shell" data-reader-shell>
    <div class="toc-dock" data-toc-dock>
      <button class="toc-toggle" type="button" aria-expanded="false" aria-controls="reader-toc" aria-label="Table of contents" data-toc-toggle>☰</button>
      <aside class="toc-panel" id="reader-toc" aria-label="Table of contents" data-toc-panel>
        <p class="toc-heading" data-toc-heading>Contents</p>
        <nav class="toc-list" data-reader-toc-list></nav>
      </aside>
    </div>

    <section class="book-stage" aria-live="polite">
      <div class="book-spread" data-book-spread>
        <article class="book-page" data-book-page="left"></article>
        <article class="book-page" data-book-page="right"></article>
      </div>

      <article class="book-page pagination-probe" data-pagination-probe aria-hidden="true"></article>

      <div class="reader-status">
        <div class="reader-pager">
          <button class="reader-page-nav" type="button" data-page-previous aria-label="Previous page">←</button>
          <span data-reader-position>Loading…</span>
          <button class="reader-page-nav" type="button" data-page-next aria-label="Next page">→</button>
        </div>
        <span data-reader-mode>Book spread</span>
      </div>
    </section>
  </main>
</body>
</html>
